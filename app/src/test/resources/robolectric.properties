# One input method shadow for every test class (2026-10-11). The keyboard list reloads in many tests' tearDown refresh
# the input method's caches in the background (RichInputMethodManager.refreshSubtypeCaches); one still running when the
# next class starts met that class's other shadow there: "Cannot cast ShadowInputMethodManager to
# ShadowInputMethodManager2", reported as uncaught exceptions before that class's next Compose test (and a test skipped
# that way skipped its tearDown, leaving the next settings screens dead). Since the first start stores a default
# keyboard, every reload's refresh reaches the input method.
shadows=helium314.keyboard.ShadowInputMethodManager2
